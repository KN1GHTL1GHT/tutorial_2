<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grids and Flex: Responsive Page Design</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-layout">
  <div>
    this is the header
  </div>
  <div>
    <div class="container">
      <div class="component">
        <div class="header">
          <div class="header-image">
            <i class="fa-regular fa-images"></i>
          </div>
          <h2 class="header-title">Header</h2>
          <div class="author">
            <i class="fa-solid fa-circle-user"></i>
            <span>Author Name</span>
          </div>
          <time class="header-date" datetime="2025-09-18">Sep 18, 2025</time>
          <p class="header-desc">Lorem ipsum dolor sit amet consectetur. Vel elementum ipsum.</p>
        </div>
        <div class="actionbar">
          <span><i class="fa-regular fa-comment"></i><span class="actionbar-text">2 comments</span></span>
          <span><i class="fa-regular fa-heart"></i><span class="actionbar-text">10 likes</span></span>
          <span><i class="fa-regular fa-bookmark"></i><span class="actionbar-text">3 saves</span></span>
        </div>
        <div class="content">
          this is the content
        </div>
      </div>
      <div class="component">
        this is the component
      </div>
      <div class="component">
        this is the component
      </div>
    </div>
  </div>
  <div>
    this is the footer
  </div>
</body>
</html>
